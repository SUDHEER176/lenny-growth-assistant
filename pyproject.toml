[project]
name = "dhl"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pyright]
extraPaths = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
